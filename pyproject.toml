[project]
name = "platosim"
version = "3.7.1"
description = "PlatoSim: An end-to-end PLATO camera simulator"
readme = "README.md"
requires-python = ">=3.12,<3.16"

authors = [
    { name = "KU Leuven and the PlatoSim team" }
]

dependencies = [
    "numpy>=2.5.3,<3.0.0",
    "pyaml>=26.7.0,<27.0.0",
    "h5py>=3.16.0,<4.0.0",
    "tqdm>=4.70.1,<5.0.0",
    "colorama>=0.4.6,<0.5.0",
    "prettytable>=3.18.0,<4.0.0",
    "shapely>=2.2.0,<3.0.0",
    "datetime>=6.0,<7.0",
    "pandas>=3.0.6,<4.0.0",
    "scipy>=1.18.1,<2.0.0",
    "scikit-image>=0.26.0,<0.27.0",
    "astropy>=8.0.1,<9.0.0",
    "matplotlib>=3.11.2,<4.0.0",
    "ipywidgets>=8.1.9,<9.0.0",
    "notebook",
    "jupyter-client",
    "traitlets",
    "tornado",
    "jupyter>=1.1.1,<2.0.0",
    "setuptools>=84.0.0",
    "ipympl>=0.10.0",
]

[dependency-groups]
platonium = [
    "argos>=0.4.5,<0.5.0",
    "pyqt5>=5.15.11,<6.0.0",
    "pyarrow>=26.0.0,<27.0.0",
    "zipp>=4.1.1,<5.0.0",
    "natsort>=8.4.0,<9.0.0",
    "numba>=0.68.0,<0.69.0",
    "astroquery>=0.4.11,<0.5.0",
    "ldtk>=1.9.1,<2.0.0",
    "joblib>=1.6.0,<2.0.0",
    "lmfit>=1.3.4,<2.0.0",
    "statsmodels>=0.15.0,<0.16.0",
    "wotan>=1.10,<2.0.0",
    "transitleastsquares>=2.0,<3.0.0",
    "batman-package>=2.5.3,<3.0.0",
    "pyastronomy>=0.25.0,<0.26.0",
    "ligo-skymap>=2.5.0,<3.0.0",
]

pipeline = [
    "cython>=3.3.0,<4.0.0",
    "mpi4py>=4.1.2,<5.0.0",
]

docs = [
    "sphinx>=9.1.0,<10.0.0",
    "renku-sphinx-theme>=0.5.2,<0.6.0",
]

pandora = [
    "pandoramoon>=1.3,<2.0",
    "ultranest>=4.5.2,<5.0.0",
    "dynasty>=0.0.3,<0.1.0",
]

dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/platosim"]
