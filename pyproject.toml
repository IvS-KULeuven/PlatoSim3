[tool.poetry]
name = "platosim"
version = "3.7.1"
description = "PlatoSim: An end-to-end PLATO camera simulator"
authors = ["KU Leuven and the PlatoSim team"]
readme = "README.md"
packages = [{include = "python/platosim"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.16"
numpy = "^2.5.3"
pyaml = "^26.7.0"
h5py = "^3.16.0"
tqdm = "^4.70.1"
colorama = "^0.4.6"
prettytable = "^3.18.0"
shapely = "^2.2.0"
datetime = "^6.0"
pandas = "^3.0.6"
scipy = "^1.18.1"
scikit-image = "^0.26.0"
astropy = "^8.0.1"
matplotlib = "^3.11.2"
ipywidgets = "^8.1.9"
notebook = ">=6.4.6,<6.4.7"
jupyter-client = "7.3.2"
traitlets = "5.9.0"
tornado = "6.1.0"
jupyter = "^1.1.1"

[tool.poetry.group.platonium]
optional = true
[tool.poetry.group.platonium.dependencies]
argos = "^0.4.5"
pyqt5 = "^5.15.11"
pyarrow = "^26.0.0"
zipp = "^4.1.1"
natsort = "^8.4.0"
numba = "^0.68.0"
astroquery = "^0.4.11"
ldtk = "^1.9.1"
joblib = "^1.6.0"
lmfit = "^1.3.4"
statsmodels = "^0.15.0"
wotan = "^1.10"
transitleastsquares = "^2.0"
batman-package = "^2.5.3"
pyastronomy = "^0.25.0"
ligo-skymap = "^2.5.0"

[tool.poetry.group.pipeline]
optional = true
[tool.poetry.group.pipeline.dependencies]
cython = "^3.3.0"
mpi4py = "^4.1.2"

[tool.poetry.group.docs]
optional = true
[tool.poetry.group.docs.dependencies]
sphinx = "^9.1.0"
renku-sphinx-theme = "^0.5.2"

# Custom environments

[tool.poetry.group.pandora]
optional = true
[tool.poetry.group.pandora.dependencies]
pandoramoon = "^1.3"
ultranest = "^4.5.2"
dynasty = "^0.0.3"

[poetry.group.dev.dependencies]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
